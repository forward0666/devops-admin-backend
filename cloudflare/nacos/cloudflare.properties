# Cloudflare Service Config
# Nacos dataId: cloudflare.properties
# Group: DEFAULT_GROUP

## Service
service.name=cloudflare
service.port=8090
service.ip=127.0.0.1

## Cloudflare API
cf.base-url=https://api.cloudflare.com/client/v4

## MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:192.168.86.9}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cloudflare}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=CloudflareServiceHikariCP

## Redis
spring.data.redis.host=${REDIS_HOST:192.168.86.9}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:root123}
spring.data.redis.database=0
spring.data.redis.timeout=10000ms

## MongoDB
spring.data.mongodb.host=${MONGODB_HOST:192.168.86.9}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:cloudflare}
spring.data.mongodb.username=${MONGODB_USERNAME:root}
spring.data.mongodb.password=${MONGODB_PASSWORD:root123}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB:admin}

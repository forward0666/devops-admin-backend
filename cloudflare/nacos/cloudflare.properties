# Cloudflare Service Config
# Nacos dataId: cloudflare.properties
# Group: DEFAULT_GROUP

## Service
service.name=cloudflare
service.port=8090
service.ip=127.0.0.1

## Cloudflare API
cf.base-url=https://api.cloudflare.com/client/v4

## MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:10.10.72.33}:${MYSQL_PORT:31130}/${MYSQL_DATABASE:cloudflare}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

## Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=2000ms

## MongoDB
spring.data.mongodb.host=${MONGODB_HOST:10.10.72.40}
spring.data.mongodb.port=${MONGODB_PORT:32290}
spring.data.mongodb.database=${MONGODB_DATABASE:cloudflare}
spring.data.mongodb.username=${MONGODB_USERNAME:root}
spring.data.mongodb.password=${MONGODB_PASSWORD:root}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB:admin}

# ========================================
# Nacos Config
spring.config.import=optional:nacos:cloudflare.properties
spring.cloud.nacos.config.name=cloudflare.properties
spring.cloud.nacos.config.server-addr=${NACOS_HOST:nacos.middleware}:${NACOS_PORT:8848}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD}
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:6c5b1db3-a808-4543-a87e-6642e372cb4f}
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}

spring.cloud.nacos.discovery.server-addr=${spring.cloud.nacos.config.server-addr}
spring.cloud.nacos.discovery.username=${spring.cloud.nacos.config.username}
spring.cloud.nacos.discovery.password=${spring.cloud.nacos.config.password}
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}

# Application
spring.application.name=cloudflare
server.port=8090
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true

# CF API
cf.base-url=https://api.cloudflare.com/client/v4

# Nacos config fallbacks (local dev)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:192.168.86.9}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:manage}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

spring.data.mongodb.host=${MONGODB_HOST:192.168.86.9}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:cloudflare}
spring.data.mongodb.username=${MONGODB_USERNAME:root}
spring.data.mongodb.password=${MONGODB_PASSWORD}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB:admin}

spring.data.redis.host=${REDIS_HOST:192.168.86.9}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}

# Logging
logging.level.com.backend.cloudflare=DEBUG
# XXL-Job Executor
xxl.job.admin.addresses=${XXL_JOB_ADMIN:http://192.168.86.9:8080/xxl-job-admin}
xxl.job.executor.appname=cloudflare-service
xxl.job.executor.port=9998
xxl.job.accessToken=${XXL_JOB_TOKEN}

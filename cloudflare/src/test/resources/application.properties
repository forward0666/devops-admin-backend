# Test profile - disable cloud integrations
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,com.alibaba.cloud.nacos.NacosDiscoveryAutoConfiguration
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.main.allow-bean-definition-overriding=true
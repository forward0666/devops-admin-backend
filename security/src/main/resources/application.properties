# ============================================
# 数据库配置文件 - MySQL SSL 连接
# ============================================
spring.datasource.url=jdbc:mysql://mysql.middleware:3306/security?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=true&requireSSL=true&verifyServerCertificate=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQL_USER:security}
spring.datasource.password=${MYSQL_PASSWORD:security}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT（从 K8s Secret 环境变量注入）
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}

# Feign
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.circuitbreaker.enabled=false

# Nacos 注册
spring.cloud.nacos.discovery.enabled=false

# 日志
logging.level.com.backend.security=INFO
logging.level.com.alibaba.cloud.nacos=WARN

# 监控
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.server.port=8082
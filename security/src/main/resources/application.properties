# Application Name
spring.application.name=security

# Nacos Configuration
spring.cloud.nacos.config.name=security.properties
spring.cloud.nacos.config.server-addr=${NACOS_HOST:nacos.middleware}:${NACOS_PORT:8848}
spring.cloud.nacos.config.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.config.password=${NACOS_PASSWORD}
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.refresh-enabled=true

spring.cloud.nacos.discovery.server-addr=${spring.cloud.nacos.config.server-addr}
spring.cloud.nacos.discovery.username=${spring.cloud.nacos.config.username}
spring.cloud.nacos.discovery.password=${spring.cloud.nacos.config.password}
spring.cloud.nacos.discovery.service=${spring.application.name}
spring.cloud.nacos.discovery.heart-beat-timeout=10000
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}

spring.datasource.url=jdbc:mysql://mysql.middleware:3306/security?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=true&requireSSL=true&verifyServerCertificate=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQL_USER:security}
spring.datasource.password=${MYSQL_PASSWORD:security}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.expiration=86400

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

logging.level.com.backend.security=INFO